<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Voynich handwriting study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One centred column, one task per screen. Light theme only: the crops must look the same for everyone. */
:root{
  --bg:#eceee6; --surface:#f7f8f3; --ink:#26221c; --muted:#6c6858; --line:#cfd2c4;
  --accent:#2f6f73; --accent-ink:#f4f7f5; --test:#8a5a00; --crop:#e8e8e8;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
main{max-width:820px;margin:0 auto;padding-block:24px 44px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,6vw,44px)} h2{font-size:clamp(21px,4.4vw,27px)}
p{margin:0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.test{color:var(--test);border:1px solid currentColor;border-radius:4px;padding:0 6px;letter-spacing:.08em}
.stack{display:flex;flex-direction:column;gap:14px}
.fine{font-size:14px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px 10px;font-family:var(--display);font-size:clamp(19px,4.2vw,24px);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.choice:hover{border-color:var(--accent)}
/* crops */
.set{display:flex;justify-content:center;gap:var(--gap,14px);flex-wrap:wrap}
.set.col{flex-direction:column;align-items:center}
.cell{background:var(--crop);border:3px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.cell img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
button.cell:not(:disabled):hover{border-color:var(--accent)}
.cell.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.cell .k{position:absolute;left:5px;top:3px;font-size:11px;color:#777;font-family:var(--body)}
.probe{display:flex;flex-direction:column;align-items:center;gap:6px}
.probe .cell{border-color:var(--ink)}
.q{display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ .progress div{transition:none} }
</style>
</head>
<body>
<main id="app"></main>
<script>
// ===================== settings =====================
const VERSION = "1.1";
const N_DECKS = 360;
const BUILD = "0cece08aac";      // id of the deck set; the private key file with the same id decodes the answers
// Google Form that receives the answers (one row per save). Leave FORM empty for a test build: nothing is sent.
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSeJtEaunZh-2kb6MGGyPDqmrwLAEmviepfvzOZAm2EKPPKkqg/formResponse';
const F_SID = 'entry.264376674', F_DATA = 'entry.728211652';
const CLOSE_AT = null;                 // e.g. new Date("2026-12-31T23:59:59+01:00"); after it: try-out only, nothing saved
const BREAK_EVERY = 12;
const QUESTION = 'Which one is written least like the other two?';
const HINT = 'Look at the shape of the strokes, not at how dark or sharp the image is.';
// =====================================================
const TEST = !FORM || new URLSearchParams(location.search).has('test');
const isClosed = () => CLOSE_AT && Date.now() > CLOSE_AT.getTime();
const app = document.getElementById('app');
const state = { answers: [], end: {}, startedAt: null, sid: null, deck: null, saved: null, stoppedEarly: false, savedN: 0, done: false, counted: false };
let trials = [], ti = 0, shownAt = 0, busy = false;

const LS = 'vt-hands';
const mem = (() => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ return {}; } })();
const remember = () => { try { localStorage.setItem(LS, JSON.stringify(mem)); } catch(e){} };
function newSid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random()*16|0).toString(16))); }
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

// Saved at every break and at the end; each save is one row holding everything so far (the analysis keeps the last row per session).
function payload(final){
  const data = { sid: state.sid, version: VERSION, build: BUILD, deck: state.deck, final: !!final, stoppedEarly: state.stoppedEarly,
    startedAt: state.startedAt, savedAt: new Date().toISOString(), runs: mem.runs || 0,
    screen: { w: innerWidth, h: innerHeight, dpr: devicePixelRatio || 1, touch: matchMedia('(pointer:coarse)').matches, narrow: innerWidth < 600 },
    end: state.end, answers: state.answers };
  return { data, body: new URLSearchParams({ [F_SID]: state.sid, [F_DATA]: JSON.stringify(data) }) };
}
const canSave = () => !TEST && !isClosed() && !document.getElementById('hp')?.value;   // honeypot filled: a bot
async function saveSession(final){
  if (!canSave()) { state.saved = true; return; }
  const { data, body } = payload(final), n = state.answers.length;
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      await fetch(FORM, { method: 'POST', mode: 'no-cors', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: body.toString() });
      state.saved = true; state.savedN = Math.max(state.savedN, n);
      if (final && !state.counted){ state.counted = true; mem.finishedAt = data.savedAt; mem.runs = (mem.runs||0) + 1; remember(); } return;
    } catch(e) {}
    await new Promise(res => setTimeout(res, 800 + Math.random()*800));
  }
  state.saved = false;
}
// Someone who closes the tab between two breaks: send what is not saved yet while the page goes away.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !state.sid || state.done || state.answers.length <= state.savedN || !canSave()) return;
  try { if (navigator.sendBeacon(FORM, payload(false).body)) state.savedN = state.answers.length; } catch(e) {}
});

function screen(html){ app.innerHTML = html; window.scrollTo(0,0); const f = app.querySelector('[autofocus]'); f && f.focus({preventScroll:true}); }
const head = (step) => `<div class="eyebrow"><span>Voynich Talk · handwriting study</span>${TEST ? '<span class="test">test: nothing is saved</span>' : ''}${step ? `<span>${step}</span>` : ''}</div>`;
const bar = () => `<div class="progress" aria-hidden="true"><div style="width:${ti/trials.length*100}%"></div></div>`;

const imgCache = {};
const PREVIEW = /*__PREVIEW__*/null;       // single-file try-out build: one deck and its images inlined
const src = code => PREVIEW ? PREVIEW.img[code] : `img/${code}.png`;
function loadImg(code){ return imgCache[code] ||= new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src(code); }); }
const preload = t => t && t.c.forEach(loadImg);

function welcome(){
  screen(`${head()}
    <h1>How do you see the handwriting?</h1>
    <div class="stack">
      <p>This is a short study on how people see the handwriting in the Voynich manuscript, a medieval book in a script nobody can read.</p>
      <p>You will see small snippets of a single glyph or glyph cluster, cut from its pages, three at a time. Each time, pick the one that is written least like the other two. A few screens show nine snippets instead.</p>
      <p>There are no right or wrong answers and you need no knowledge of the manuscript. Go with your eyes.</p>
      <p class="fine">Anonymous: we store your choices, how long each took, your screen size and two answers about yourself at the end. It takes about eight minutes; you can stop at every break and what you did still counts.</p>
      <input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    </div>
    ${isClosed() ? `<p><b>The study has closed.</b> You are welcome to try it, but your answers are no longer saved.</p>` : ''}
    ${mem.finishedAt ? `<p class="fine">You already took part on ${new Date(mem.finishedAt).toLocaleDateString()}. You are welcome to do it again with new snippets.</p>` : ''}
    <button class="btn" id="go" autofocus>${isClosed() ? 'Try it anyway' : 'Start'}</button>`);
  document.getElementById('go').onclick = instructions;
}
function instructions(){
  screen(`${head('How it works')}
    <h2>${QUESTION}</h2>
    <div class="stack">
      <p>${HINT}</p>
      <p>Some snippets are faint, blotchy or grainy; that comes from the parchment and the photograph. Try to look through it at how the pen moved: the shapes, the proportions, the slant, the way strokes begin and end.</p>
      <p>Tap or click a snippet to choose it (on a keyboard: <b>1</b>, <b>2</b>, <b>3</b>). You can't go back, so don't overthink it. The first few are for getting used to it. After every ${BREAK_EVERY} your answers are saved and you can stop or carry on.</p>
    </div>
    <button class="btn" id="go" autofocus>Show the first three</button>`);
  document.getElementById('go').onclick = start;
}
async function start(){
  const go = document.getElementById('go'); go.disabled = true;
  state.startedAt = new Date().toISOString(); state.sid = newSid(); state.answers = []; state.end = {}; state.stoppedEarly = false; state.savedN = 0; state.done = false; state.counted = false;
  // a deck not used before on this device, otherwise any
  const seen = mem.decks || []; let d;
  for (let k = 0; k < 20; k++){ d = Math.floor(Math.random() * N_DECKS); if (!seen.includes(d)) break; }
  try {
    const deck = PREVIEW ? PREVIEW.deck : await (await fetch(`decks/${d}.json`, { cache: 'no-cache' })).json();
    trials = deck.trials; state.deck = deck.deck; mem.decks = [...seen, d].slice(-50); remember();
  } catch(e){ go.disabled = false; go.insertAdjacentHTML('afterend', '<p class="fine">Could not load the snippets. Check your connection and try again.</p>'); return; }
  ti = 0; await Promise.all(trials[0].c.map(loadImg)).catch(() => {}); trial();
}

// ---------- layout: every crop on a screen gets the same scale ----------
function fit(dims, n, perRow, maxScale){
  const cw = Math.min(app.clientWidth, 820), gap = innerWidth < 600 ? 8 : 14, bw = 6;
  const w = Math.max(...dims.map(d => d[0])), h = Math.max(...dims.map(d => d[1]));
  const s = Math.min(maxScale, (cw - 6 - gap * (perRow - 1) - bw * perRow) / (perRow * w));
  return { s, gap, w: Math.round(w * s), h: Math.round(h * s) };
}
const cellHtml = (code, k, tag, f, label) => `<${tag} class="cell" data-c="${code}" ${tag === 'button' ? 'disabled' : ''} style="width:${f.w + 6}px;height:${f.h + 6}px" aria-label="${label}">
  ${k ? `<span class="k">${k}</span>` : ''}<img src="${src(code)}" alt="" draggable="false"></${tag}>`;

async function trial(){
  const t = trials[ti];
  const imgs = await Promise.all(t.c.map(loadImg)).catch(() => null);
  if (!imgs) { ti++; return next(); }                       // an image failed to load: skip this screen
  const dims = imgs.map(i => [i.naturalWidth, i.naturalHeight]);
  preload(trials[ti + 1]);
  t.g ? gridScreen(t, dims) : tripletScreen(t, dims);
}
function tripletScreen(t, dims){
  const order = shuffle(t.c.map((c, k) => k));               // positions randomised here, logged below
  const wide = Math.max(...dims.map(d => d[0])) > 100, narrow = innerWidth < 600;
  let f = fit(dims, 3, 3, 2.5), col = false;
  if (wide && f.s < 1.6){ f = fit(dims, 3, 1, 2.2); col = true; }
  screen(`${head(`${ti+1} of ${trials.length}`)}${bar()}
    <div class="q"><h2>${QUESTION}</h2><p class="fine">${HINT}</p></div>
    <div class="set ${col ? 'col' : ''}" style="--gap:${f.gap}px">${order.map((k, p) => cellHtml(t.c[k], p + 1, 'button', f, 'Snippet ' + (p + 1))).join('')}</div>`);
  const cells = [...app.querySelectorAll('button.cell')];
  const shown = order.map(k => t.c[k]);
  setTimeout(() => { shownAt = performance.now(); cells.forEach((b, p) => { b.disabled = false; b.onclick = () => {
    if (busy) return; busy = true; b.classList.add('on');
    state.answers.push({ t: t.id, n: ti, c: shown, pick: [p], rt: Math.round(performance.now() - shownAt), lay: col ? 'col' : 'row', s: +f.s.toFixed(2) });
    setTimeout(() => { busy = false; ti++; next(); }, 140);
  }; }); }, 350);
}
function gridScreen(t, dims){
  const rest = shuffle(t.c.slice(1).map((c, k) => k + 1)), narrow = innerWidth < 600, per = narrow ? 3 : 4;
  const f = fit(dims, 8, per, dims[0][0] > 100 ? 1.35 : 2);
  screen(`${head(`${ti+1} of ${trials.length}`)}${bar()}
    <div class="q"><h2>Pick the two most like the top one</h2><p class="fine">${HINT}</p></div>
    <div class="probe">${cellHtml(t.c[0], '', 'div', f, 'The snippet to compare with')}</div>
    <div class="set" style="--gap:${f.gap}px;max-width:${per * (f.w + 6) + (per - 1) * f.gap + 2}px;margin:0 auto">${rest.map((k, p) => cellHtml(t.c[k], '', 'button', f, 'Snippet ' + (p + 1))).join('')}</div>
    <div class="row"><span class="fine" id="cnt">Choose two</span><button class="btn" id="ok" disabled>Continue</button></div>`);
  const cells = [...app.querySelectorAll('button.cell')], picks = [], ok = document.getElementById('ok'), shown = [t.c[0], ...rest.map(k => t.c[k])];
  const upd = () => { ok.disabled = picks.length !== 2; document.getElementById('cnt').textContent = picks.length === 2 ? 'Two chosen' : picks.length === 1 ? 'Choose one more' : 'Choose two'; };
  setTimeout(() => { shownAt = performance.now(); cells.forEach((b, p) => { b.disabled = false; b.onclick = () => {
    const at = picks.findIndex(x => x.p === p);
    if (at >= 0){ picks.splice(at, 1); b.classList.remove('on'); }
    else if (picks.length < 2){ picks.push({ p, rt: Math.round(performance.now() - shownAt) }); b.classList.add('on'); }
    upd();
  }; }); }, 350);
  ok.onclick = () => { if (busy || picks.length !== 2) return; busy = true;
    state.answers.push({ t: t.id, n: ti, c: shown, pick: picks.map(x => x.p + 1), rts: picks.map(x => x.rt), rt: Math.round(performance.now() - shownAt), lay: 'grid' + per, s: +f.s.toFixed(2) });
    busy = false; ti++; next(); };
}
function next(){
  if (ti >= trials.length) return endQuestions();
  if (ti % BREAK_EVERY === 0) return pause();
  trial();
}
function pause(){
  saveSession(false);
  const left = trials.length - ti, n = Math.min(BREAK_EVERY, left);
  screen(`${head(`${ti} of ${trials.length}`)}${bar()}
    <h2>${ti} done, ${left} to go</h2>
    <p>Your answers so far are saved. You can stop here, or do ${n === left ? 'the last' : 'another'} ${n}. The glyph may change along the way; the question stays the same.</p>
    <div class="choices">
      <button class="choice" id="more" autofocus>Keep going<small>${n} more</small></button>
      <button class="choice" id="stop">Stop here<small>two short questions, then done</small></button>
    </div>`);
  preload(trials[ti]);
  document.getElementById('more').onclick = trial;
  document.getElementById('stop').onclick = () => { state.stoppedEarly = true; endQuestions(); };
}
document.addEventListener('keydown', e => {
  if (!['1','2','3'].includes(e.key)) return;
  const set = app.querySelector('.set'); if (!set || app.querySelector('#ok')) return;
  const b = set.querySelectorAll('button.cell')[+e.key - 1]; if (b && !b.disabled) b.click();
});

// ---------- the end: two questions, asked only now ----------
function endQuestions(){
  const opt = (name, v, label) => `<label class="opt"><input type="radio" name="${name}" value="${v}" required><span>${label}</span></label>`;
  screen(`${head('Almost done')}
    <h2>Two last questions</h2>
    <form id="f" class="stack">
      <fieldset><legend>How well did you know the Voynich manuscript before today?</legend>
        ${opt('know',0,'I had never heard of it')}
        ${opt('know',1,'I have seen a video or read an article or two')}
        ${opt('know',2,'I follow the research')}
        ${opt('know',3,'I do my own research on it')}
      </fieldset>
      <fieldset><legend>How familiar are you with Lisa Fagin Davis' work on the scribes of the manuscript?</legend>
        ${opt('davis',0,'Not at all')}
        ${opt('davis',1,'I have heard of it')}
        ${opt('davis',2,'I am familiar with it and know more or less which method she used to tell the scribal hands apart')}
      </fieldset>
      <button class="btn" id="fin" disabled>Finish</button>
    </form>`);
  const f = document.getElementById('f');
  f.oninput = () => { document.getElementById('fin').disabled = !['know','davis'].every(n => f.querySelector(`input[name=${n}]:checked`)); };
  f.onsubmit = e => { e.preventDefault(); const v = n => f.querySelector(`input[name=${n}]:checked`).value;
    state.end = { know: +v('know'), davis: +v('davis') }; finish(); };
}
async function finish(){
  screen(`${head('Done')}<h2>Saving your answers…</h2>`);
  await saveSession(true);
  if (!state.saved){                                   // no connection: keep the answers on the page and offer to try again
    screen(`${head('Not saved yet')}
      <h2>Your answers could not be saved</h2>
      <p>The connection seems to be down. Keep this page open, check your connection and try again.</p>
      <button class="btn" id="retry" autofocus>Try saving again</button>`);
    document.getElementById('retry').onclick = finish; return;
  }
  state.done = true;
  screen(`${head('Done')}
    <h1>Thank you!</h1>
    <div class="stack">
      <p>You judged ${state.answers.length} screens. ${TEST ? 'This is a test build, so nothing was saved.' : 'Your answers are saved.'}</p>
      <p><b>One request:</b> please don't discuss what you think this study is about, in comments or elsewhere, until it has closed. Others should come to it as fresh as you did.</p>
      <p class="fine">What everyone saw, taken together, comes in a later Voynich Talk video.</p>
    </div>
    <button class="btn" id="again">Do another round with new snippets</button>`);
  document.getElementById('again').onclick = welcome;
}
welcome();
</script>
</body>
</html>
